<!doctype html>
<html lang="en-IN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Newsdesk — Market Intelligence | Mr. Chartist</title>
    <meta name="description" content="Live Indian market news, NSE screener, sector rotation and watchlist — 30+ sources in one calm, fast workspace. Part of the Mr. Chartist family." />
    <meta name="author" content="Rohit Singh (Mr. Chartist)" />
    <meta name="theme-color" content="#0F0E0D" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Newsdesk" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <script>
      /* Pre-hydration theme boot — runs before first paint so there is no flash.
         "system" follows the OS (macOS / iOS Auto); default is dark, like IPO Decode. */
      (function () {
        var r = document.documentElement, t;
        try { t = localStorage.getItem('newsdesk-theme') || 'dark'; } catch (e) { t = 'dark'; }
        var eff = t === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : (t === 'light' ? 'light' : 'dark');
        r.classList.remove('dark', 'light');
        r.classList.add(eff);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', eff === 'light' ? '#F9F7F4' : '#0F0E0D');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
